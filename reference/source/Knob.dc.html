<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=VT323&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="./toy.js"></script>
<script src="./numberflow.js"></script>
</helmet>
<div style="display:flex;min-height:480px;border-radius:16px;overflow:hidden;border:1px solid rgba(22,22,20,.1)">
  <sc-if value="{{ is.minimal }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;background:#fafaf8;display:flex;align-items:center;justify-content:center;padding:36px 20px;font-family:Geist,sans-serif;color:#161614">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#77756e">Level</div>
        <div style="position:relative;width:240px;height:240px">
          <div data-toy="knob" data-steps="101" data-min="-135" data-max="135" data-angle="59.4" data-init="72" role="slider" aria-label="Level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" tabindex="0" ref="{{ knobRef }}" style="position:absolute;inset:0;border-radius:50%;cursor:grab;touch-action:none;outline-offset:6px">
            <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="41"><span style="position:absolute;left:{{ t.left }};top:0;width:{{ t.w }};height:{{ t.h }};background:{{ t.c }};transform-origin:{{ t.origin }};transform:rotate({{ t.r }})"></span></sc-for>
            <div style="position:absolute;inset:26px;border-radius:50%;background:#fff;border:1px solid #e6e4df;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 24px -14px rgba(0,0,0,.22)"></div>
            <div data-cap style="position:absolute;inset:26px;border-radius:50%;transform:rotate(59.4deg)"><span style="position:absolute;left:50%;top:12px;width:2px;height:26px;margin-left:-1px;background:#161614;border-radius:1px"></span></div>
          </div>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:48px;letter-spacing:-.045em;line-height:1"><nayam-num value="{{ pct }}"></nayam-num></span><span style="font-size:16px;color:#77756e">%</span></div>
        <div style="display:flex;justify-content:space-between;width:200px;font-family:'Geist Mono',monospace;font-size:11px;color:#99968e"><span>0</span><span>100</span></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ is.craft }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;background:#efe7d8;display:flex;align-items:center;justify-content:center;padding:36px 20px;font-family:'Bricolage Grotesque',sans-serif;color:#2a1f14">
      <div style="position:relative;padding:30px 34px 26px;background-color:#fbf7ef;border-radius:8px;transform:rotate(-1deg);box-shadow:0 2px 4px rgba(70,45,20,.12),0 22px 36px -14px rgba(70,45,20,.4);display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(240,220,160,.82);transform:rotate(2deg)"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d6650">Dial No. 07 · Level</div>
        <div style="position:relative;width:260px;height:260px">
          <sc-for list="{{ labels }}" as="l" hint-placeholder-count="5"><span style="position:absolute;left:50%;top:50%;transform:{{ l.tf }};font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:#5a4632">{{ l.n }}</span></sc-for>
          <div data-toy="knob" data-steps="101" data-min="-135" data-max="135" data-angle="59.4" data-init="72" role="slider" aria-label="Level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" tabindex="0" ref="{{ knobRef }}" style="position:absolute;inset:20px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:6px">
            <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="41"><span style="position:absolute;left:{{ t.left }};top:0;width:{{ t.w }};height:{{ t.h }};background:{{ t.c }};transform-origin:{{ t.origin }};transform:rotate({{ t.r }})"></span></sc-for>
            <div style="position:absolute;inset:32px;border-radius:50%;background:#f4ecdd;border:2px solid #2a1f14;box-shadow:inset 0 0 0 5px #fbf7ef,inset 0 0 0 6px rgba(42,31,20,.25),0 3px 6px rgba(70,45,20,.3),0 14px 18px -8px rgba(70,45,20,.45)"></div>
            <div data-cap style="position:absolute;inset:32px;border-radius:50%;transform:rotate(59.4deg)"><span style="position:absolute;left:50%;top:10px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:34px solid #b8471f"></span><span style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#e0713a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 2px 3px rgba(70,45,20,.35)"></span></div>
          </div>
        </div>
        <div style="display:flex;align-items:baseline;gap:10px"><span style="font-weight:800;font-size:40px;letter-spacing:-.04em;line-height:1"><nayam-num value="{{ pct }}"></nayam-num>%</span><span style="font-family:Caveat,cursive;font-size:26px;color:#b8471f;transform:rotate(-4deg);display:inline-block">turn me</span></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ is.retro }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;position:relative;background:#0b0d0a;display:flex;align-items:center;justify-content:center;padding:36px 20px;font-family:VT323,monospace">
      <div style="position:relative;width:340px;max-width:100%;padding:18px;background:#2b2e2a;border:2px solid #4a4e48;box-shadow:inset 0 2px 0 #5c6159,inset 0 -2px 0 #1a1c19;display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="width:100%;display:flex;justify-content:space-between;color:#c9c9c0;font-size:20px"><span>MASTER</span><span style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;background:#4fdc68;box-shadow:0 0 6px #4fdc68"></span>PWR</span></div>
        <div style="position:relative;width:240px;height:240px">
          <sc-for list="{{ labels }}" as="l" hint-placeholder-count="11"><span style="position:absolute;left:50%;top:50%;transform:{{ l.tf }};font-size:20px;color:#c9c9c0">{{ l.n }}</span></sc-for>
          <div data-toy="knob" data-steps="11" data-min="-135" data-max="135" data-angle="54" data-init="70" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" tabindex="0" ref="{{ knobRef }}" style="position:absolute;inset:34px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:6px">
            <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="11"><span style="position:absolute;left:{{ t.left }};top:-6px;width:{{ t.w }};height:{{ t.h }};background:{{ t.c }};transform-origin:{{ t.origin }};transform:rotate({{ t.r }})"></span></sc-for>
            <div style="position:absolute;inset:14px;border-radius:50%;background:#15171a;box-shadow:0 0 0 3px #3b3f3a,0 8px 10px rgba(0,0,0,.6),inset 0 2px 0 #3a3d41"></div>
            <div data-cap style="position:absolute;inset:14px;border-radius:50%;transform:rotate(54deg);background:repeating-conic-gradient(#0e0f11 0 5deg,#202226 5deg 10deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%);mask:radial-gradient(circle,transparent 38%,#000 40%)"><span style="position:absolute;left:50%;top:4px;width:4px;height:24px;margin-left:-2px;background:#f4f1e6"></span></div>
          </div>
        </div>
        <div style="padding:4px 14px;background:#061108;border:2px inset #1c2a1d;color:#6dff8a;font-size:30px;text-shadow:0 0 6px rgba(80,255,120,.55);letter-spacing:.06em">VOL <nayam-num value="{{ pctR }}"></nayam-num> / 10</div>
      </div>
      <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)"></div>
    </div>
  </sc-if>
  <sc-if value="{{ is.toy }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;background:#e3dfd5;background-image:radial-gradient(circle,rgba(60,45,20,.09) 2px,transparent 2.5px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;padding:36px 20px;font-family:Archivo,sans-serif;color:#1e1d1a">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 18px;background:#2a2925;border-radius:12px;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);color:#f8f5ef;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:36px;line-height:1"><nayam-num value="{{ pct }}" style="--nf-lh:.95"></nayam-num><span style="font-size:18px;color:#bdb6a8">%</span></div>
        <div style="position:relative;width:260px;height:260px;margin-top:10px">
          <div data-toy="knob" data-steps="101" data-min="-135" data-max="135" data-angle="59.4" data-init="72" role="slider" aria-label="Level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" tabindex="0" ref="{{ knobRef }}" style="position:absolute;inset:10px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:6px">
            <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="21"><span style="position:absolute;left:{{ t.left }};top:0;width:{{ t.w }};height:{{ t.h }};margin-left:{{ t.ml }};border-radius:1px;background:{{ t.c }};transform-origin:{{ t.origin }};transform:rotate({{ t.r }})"></span></sc-for>
            <div style="position:absolute;inset:30px;border-radius:50%;background:#f8f5ef;box-shadow:inset 0 1px 0 #fff,0 10px 0 #d2ccbf,0 26px 30px -12px rgba(40,28,10,.5)"></div>
            <div style="position:absolute;inset:52px;border-radius:50%;background:#ef4f2b;box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 #b5311a"></div>
            <div data-cap style="position:absolute;inset:30px;border-radius:50%;transform:rotate(59.4deg)"><span style="position:absolute;left:50%;top:9px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#ef4f2b;box-shadow:inset 0 1px 1px rgba(0,0,0,.25)"></span><span style="position:absolute;left:50%;top:54px;width:8px;height:30px;margin-left:-4px;border-radius:4px;background:#f8f5ef;box-shadow:inset 0 2px 2px rgba(0,0,0,.2)"></span></div>
          </div>
          <span style="position:absolute;left:14px;bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b665b">0</span>
          <span style="position:absolute;right:6px;bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b665b">100</span>
        </div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#6b665b">DRAG · FLICK · SCROLL · ← →</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:500},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;minimal&quot;,&quot;craft&quot;,&quot;retro&quot;,&quot;toy&quot;],&quot;default&quot;:&quot;minimal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const W4 = ['minimal', 'craft', 'retro', 'toy'];
const CFG = {
  minimal: { R: 120, n: 41, major: 10, hM: 12, hm: 6, wM: '1.5px', wm: '1px', on: '#161614', off: '#d6d3cc' },
  craft: { R: 110, n: 41, major: 10, hM: 14, hm: 7, wM: '2px', wm: '1px', on: '#2a1f14', off: 'rgba(42,31,20,.35)' },
  retro: { R: 86, n: 11, major: 1, hM: 12, hm: 12, wM: '3px', wm: '3px', on: '#6dff8a', off: '#555a52' },
  toy: { R: 120, n: 21, major: 5, hM: 16, hm: 10, wM: '3px', wm: '2px', on: '#ef4f2b', off: '#a69e90' },
};
class Component extends DCLogic {
  state = { pct: 72 };
  knobRef = el => {
    if (!el || el._l) return; el._l = true;
    const retro = el.dataset.steps === '11';
    this.setState({ pct: +el.dataset.init });
    el.addEventListener('toychange', e => this.setState({ pct: retro ? e.detail.value * 10 : e.detail.value }));
    el.addEventListener('wheel', e => { e.preventDefault(); const i = el._idx ?? +el.getAttribute('aria-valuenow'); window.NayamToy && NayamToy.knobSet(el, i + (e.deltaY < 0 ? (retro ? 1 : 2) : (retro ? -1 : -2)), e.deltaY < 0 ? 200 : -200); }, { passive: false });
  };
  renderVals() {
    const v = this.props.variant ?? 'minimal', c = CFG[v] || CFG.minimal, p = this.state.pct;
    const ticks = Array.from({ length: c.n }, (_, i) => { const mj = i % c.major === 0, on = i / (c.n - 1) * 100 <= p + .01; return { left: (c.R - (mj ? 1.5 : .5)) + 'px', origin: `50% ${c.R}px`, r: (-135 + i * 270 / (c.n - 1)).toFixed(2) + 'deg', h: (mj ? c.hM : c.hm) + 'px', w: mj ? c.wM : c.wm, ml: mj ? '-1px' : '0', c: on ? c.on : c.off }; });
    const lc = v === 'retro' ? 11 : 5, labR = v === 'retro' ? 112 : 112;
    const labels = Array.from({ length: lc }, (_, i) => { const a = -135 + i * 270 / (lc - 1); return { n: v === 'retro' ? i : i * 25, tf: `translate(-50%,-50%) rotate(${a}deg) translateY(-${v === 'retro' ? 116 : 122}px) rotate(${-a}deg)` }; });
    return { is: Object.fromEntries(W4.map(w => [w, w === v])), knobRef: this.knobRef, ticks, labels, pct: p, pctR: Math.round(p / 10) };
  }
}
</script>
</body>
</html>

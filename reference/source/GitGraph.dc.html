<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=VT323&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes px-on{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
</style>
<script src="./toy.js"></script>
</helmet>
<div style="display:flex;min-height:560px;border-radius:16px;overflow:hidden;border:1px solid rgba(22,22,20,.1)">
  <div style="flex:1;background:{{ u.bg }};background-image:{{ u.bgi }};background-size:22px 22px;display:flex;align-items:center;justify-content:center;padding:28px 18px">
    <div style="position:relative;width:100%;max-width:880px;border:{{ u.fb }};border-radius:{{ u.fr }};background:{{ u.fbg }};box-shadow:{{ u.fsh }};font-family:{{ u.ff }};color:{{ u.ink }};text-shadow:{{ u.tsh }};overflow:hidden">
      <div style="display:flex;justify-content:space-between;padding:{{ u.hp }};background:{{ u.hbg }};color:{{ u.hfg }};font-size:{{ u.hs }};text-shadow:none;border-bottom:{{ u.hb }}"><span>{{ u.title }}</span><span style="display:{{ u.hx }}">[X]</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px 0">
        <button onClick="{{ git.doMerge }}" style="{{ u.b1 }}">{{ u.l1 }}</button>
        <button data-toy="{{ u.press }}" data-depth="5" data-shadow="{{ u.sh2 }}" onClick="{{ git.doBranch }}" style="{{ u.b2 }}">{{ u.l2 }} {{ git.selHash }}</button>
        <button onClick="{{ git.doReset }}" style="{{ u.b3 }}">{{ u.l3 }}</button>
      </div>
      <div style="padding:6px 8px 0"><div style="position:relative;container-type:inline-size">
        <svg viewBox="0 0 800 330" role="img" aria-label="Git history graph" style="display:block;width:100%;height:auto">
          <sc-for list="{{ git.edges }}" as="e" hint-placeholder-count="14"><path d="{{ e.d }}" fill="none" stroke="{{ e.c }}" stroke-width="{{ e.w }}" stroke-linecap="{{ u.cap }}" stroke-linejoin="{{ u.cap }}" pathLength="1" shape-rendering="{{ u.sr }}" style="opacity:{{ e.op }};stroke-dasharray:1;animation:{{ e.anim }}"></path></sc-for>
          <sc-for list="{{ git.nodes }}" as="n" hint-placeholder-count="16">
            <g transform="translate({{ n.x }} {{ n.y }})" onMouseEnter="{{ n.enter }}" onMouseLeave="{{ n.leave }}" onClick="{{ n.pick }}" style="cursor:pointer;opacity:{{ n.op }};animation:{{ n.anim }}">
              <rect x="-16" y="-16" width="32" height="32" fill="transparent"></rect>
              <circle r="{{ u.rr }}" fill="none" stroke="{{ u.ring }}" stroke-width="2" style="display:{{ n.ring }}"></circle>
              <rect x="-7" y="-7" width="14" height="14" fill="{{ n.fill }}" stroke="{{ n.stroke }}" stroke-width="2" shape-rendering="crispEdges" style="display:{{ u.sq }}"></rect>
              <circle r="{{ u.nr }}" fill="{{ n.fill }}" stroke="{{ n.stroke }}" stroke-width="{{ u.nsw }}" style="display:{{ u.ci }}"></circle>
              <circle r="3" fill="{{ u.mk }}" style="display:{{ n.merge }}"></circle>
              <text x="12" y="30" font-family="VT323, monospace" font-size="15" fill="{{ u.mute }}" style="display:{{ n.headShow }}">HEAD</text>
            </g>
          </sc-for>
        </svg>
        <sc-for list="{{ git.lanes }}" as="l" hint-placeholder-count="3"><button onClick="{{ l.pick }}" style="position:absolute;left:{{ l.left }};top:{{ l.top }};width:20.5%;height:7.9%;display:flex;align-items:center;padding:0 1.2%;border:0;background:{{ l.bg }};color:{{ l.fg }};font-family:{{ u.lf }};font-size:{{ u.lfs }};font-weight:{{ u.lfw }};line-height:1;text-align:left;cursor:pointer;opacity:{{ l.op }};text-shadow:inherit;white-space:nowrap">{{ l.name }}</button></sc-for>
        <sc-for list="{{ git.tags }}" as="g" hint-placeholder-count="1"><span style="position:absolute;left:{{ g.left }};top:{{ g.top }};transform:translateX(-50%) rotate({{ u.tr }});padding:0 .8cqw;background:{{ u.tagbg }};color:{{ u.tagfg }};font-family:{{ u.lf }};font-size:1.9cqw;font-weight:600;line-height:1.3;text-shadow:none;pointer-events:none;white-space:nowrap;border-radius:{{ u.tagr }}">{{ g.t }}</span></sc-for>
      </div></div>
      <div style="margin:0 16px;border-top:{{ u.pb }};padding:10px 0 4px;font-size:{{ u.ps }};line-height:1.3;min-height:92px">
        <div><span style="color:{{ u.hash }}">[{{ git.cur.hash }}]</span> {{ git.cur.msg }}</div>
        <div style="color:{{ u.mute }}">{{ git.cur.meta }}</div>
        <div style="color:{{ u.acc }}">&gt; {{ git.status }}<span style="animation:{{ git.blink }}">█</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;padding:0 16px 10px;font-size:{{ u.ps }};color:{{ u.mute }}"><span>HEAD → {{ git.head }}</span><span>{{ git.count }} commits · {{ git.branches }} branches</span></div>
      <div style="position:absolute;inset:0;pointer-events:none;background:{{ u.scan }}"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:920,&quot;height&quot;:600},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;minimal&quot;,&quot;craft&quot;,&quot;retro&quot;,&quot;toy&quot;],&quot;default&quot;:&quot;retro&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const RM = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
const SX = 190, ST = 62, LY = { 'main': 70, 'feature/login': 140, 'fix/parser': 210, 'hotfix/api': 280 };
const COMMITS = [
  { id: 'a1', b: 'main', x: 0, hash: '3c1e9a0', msg: 'init: project scaffold', au: 'jana', t: '3 weeks ago', p: [] },
  { id: 'b2', b: 'main', x: 1, hash: '9d41b72', msg: 'feat: add parser core', au: 'mei', t: '3 weeks ago', p: ['a1'] },
  { id: 'c3', b: 'main', x: 2, hash: '51aa07c', msg: 'chore: bump deps', au: 'jana', t: '2 weeks ago', p: ['b2'] },
  { id: 'g1', b: 'feature/login', x: 2, hash: 'e07f3d9', msg: 'feat: login form', au: 'leo', t: '2 weeks ago', p: ['b2'] },
  { id: 'g2', b: 'feature/login', x: 3, hash: '7b2c614', msg: 'feat: session cookies', au: 'leo', t: '12 days ago', p: ['g1'] },
  { id: 'h1', b: 'fix/parser', x: 4, hash: 'c84d2f1', msg: 'fix: tokenizer edge case', au: 'mei', t: '9 days ago', p: ['g2'] },
  { id: 'd4', b: 'main', x: 4, hash: '2f93e5a', msg: 'feat: cli flags', au: 'jana', t: '9 days ago', p: ['c3'] },
  { id: 'h2', b: 'fix/parser', x: 5, hash: 'a83f21b', msg: 'fix: resolve parser issue', au: 'mei', t: '6 days ago', p: ['h1'] },
  { id: 'g3', b: 'feature/login', x: 5, hash: '6e10d88', msg: 'test: login flow', au: 'leo', t: '5 days ago', p: ['g2'] },
  { id: 'e5', b: 'main', x: 6, hash: 'b5a9c03', msg: 'release 1.0.0', au: 'jana', t: '4 days ago', p: ['d4'], tag: 'v1.0.0' },
  { id: 'f6', b: 'main', x: 7, hash: '08de7f4', msg: 'docs: write the readme', au: 'jana', t: '2 days ago', p: ['e5'] },
];
const MERGE = { id: 'm9', b: 'main', x: 8, hash: 'f12a6c5', msg: "merge branch 'feature/login'", au: 'jana', t: 'just now', p: ['f6', 'g3'], merge: true };
const px = x => SX + x * ST;
const css = s => Object.fromEntries(s.split(/;(?![^(]*\))/).filter(Boolean).map(r => { const i = r.indexOf(":"); return [r.slice(0, i).trim().replace(/-(\w)/g, (_, c) => c.toUpperCase()), r.slice(i + 1).trim()]; }));
const BTN = 'padding:3px 10px;cursor:pointer;';
const U = {
  minimal: { bg: '#fafaf8', bgi: 'none', fb: '1px solid #e6e4df', fr: '10px', fbg: '#fff', fsh: 'none', ff: 'Geist,sans-serif', ink: '#161614', tsh: 'none', title: 'git log --graph', hp: '14px 16px', hbg: 'transparent', hfg: '#77756e', hs: '12px', hb: '1px solid #eeece8', hx: 'none',
    b1: BTN + "border:1px solid #161614;background:#161614;color:#fff;border-radius:6px;font:500 12px Geist,sans-serif", b2: BTN + "border:1px solid #e6e4df;background:#fff;color:#161614;border-radius:6px;font:500 12px Geist,sans-serif", b3: BTN + "border:0;background:transparent;color:#77756e;font:500 12px Geist,sans-serif", l1: 'Merge feature', l2: 'Branch from', l3: 'Reset', press: '', sh2: '',
    cap: 'round', sr: 'auto', rr: 12, sq: 'none', ci: 'block', nr: 6, nsw: 2, mk: '#161614', mute: '#77756e', hash: '#77756e', acc: '#161614', pb: '1px solid #eeece8', ps: '13px', lf: 'Geist,sans-serif', lfs: '1.8cqw', lfw: 500, tr: '0deg', tagbg: '#161614', tagfg: '#fff', tagr: '4px', ring: '#161614', scan: 'none',
    lc: { 'main': '#161614', 'feature/login': '#5d5a53', 'fix/parser': '#97938a', 'hotfix/api': '#2f9a45' }, hot: '#161614', nfill: '#fff', curve: true, ew: 2 },
  craft: { bg: '#efe7d8', bgi: 'none', fb: '0', fr: '6px', fbg: '#fbf7ef', fsh: '0 2px 4px rgba(70,45,20,.12),0 22px 36px -14px rgba(70,45,20,.4)', ff: "'Bricolage Grotesque',sans-serif", ink: '#2a1f14', tsh: 'none', title: 'Repository log — hand-drawn', hp: '16px 18px 4px', hbg: 'transparent', hfg: '#7d6650', hs: '13px', hb: '0', hx: 'none',
    b1: BTN + "border:0;background:#ffe27a;color:#2a1f14;font:700 13px 'Bricolage Grotesque',sans-serif;box-shadow:0 3px 6px -2px rgba(70,45,20,.4);transform:rotate(-1.5deg)", b2: BTN + "border:0;background:#f2c9a0;color:#2a1f14;font:700 13px 'Bricolage Grotesque',sans-serif;box-shadow:0 3px 6px -2px rgba(70,45,20,.4);transform:rotate(1deg)", b3: BTN + "border:0;background:transparent;color:#b8471f;font:600 24px Caveat,cursive", l1: 'merge feature', l2: 'branch from', l3: 'start over', press: '', sh2: '',
    cap: 'round', sr: 'auto', rr: 13, sq: 'none', ci: 'block', nr: 7, nsw: 2.5, mk: '#2a1f14', mute: '#7d6650', hash: '#2b4a9b', acc: '#b8471f', pb: '1px dashed #b9a88f', ps: '14px', lf: "'Bricolage Grotesque',sans-serif", lfs: '1.9cqw', lfw: 800, tr: '-4deg', tagbg: '#ffe27a', tagfg: '#2a1f14', tagr: '2px', ring: '#b8471f', scan: 'none',
    lc: { 'main': '#2a1f14', 'feature/login': '#b8471f', 'fix/parser': '#2b4a9b', 'hotfix/api': '#2f9a45' }, hot: '#e0713a', nfill: '#fbf7ef', curve: true, ew: 2.5 },
  retro: { bg: '#0b0d0a', bgi: 'none', fb: '4px double #4fdc68', fr: '0', fbg: 'radial-gradient(ellipse at 50% 40%,#0c2412 0%,#061108 75%)', fsh: 'none', ff: 'VT323,monospace', ink: '#6dff8a', tsh: '0 0 5px rgba(80,255,120,.45)', title: 'C:\\PROJECT\\REPO> git log --graph', hp: '3px 10px', hbg: '#4fdc68', hfg: '#061108', hs: '20px', hb: '0', hx: 'inline',
    b1: BTN + "border:0;background:#4fdc68;color:#061108;font:20px VT323,monospace;text-shadow:none", b2: BTN + "border:0;background:#ffd34d;color:#061108;font:20px VT323,monospace;text-shadow:none", b3: BTN + "border:1px solid #3fae55;background:transparent;color:#6dff8a;font:20px VT323,monospace", l1: '[ MERGE feature ]', l2: '[ BRANCH FROM', l3: '[ RESET ]', press: '', sh2: '',
    cap: 'square', sr: 'crispEdges', rr: 13, sq: 'block', ci: 'none', nr: 7, nsw: 2, mk: '#061108', mute: '#3fae55', hash: '#ffd34d', acc: '#c9ffd2', pb: '1px dashed #1d5a2b', ps: '21px', lf: 'VT323,monospace', lfs: '2.75cqw', lfw: 400, tr: '0deg', tagbg: '#ffd34d', tagfg: '#061108', tagr: '0', ring: '#ffd34d', scan: 'repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)',
    lc: { 'main': '#6dff8a', 'feature/login': '#ffd34d', 'fix/parser': '#ff9a4d', 'hotfix/api': '#c9ffd2' }, hot: '#c9ffd2', nfill: null, curve: false, ew: 3 },
  toy: { bg: '#e3dfd5', bgi: 'radial-gradient(circle,rgba(60,45,20,.09) 2px,transparent 2.5px)', fb: '0', fr: '24px', fbg: '#f8f5ef', fsh: 'inset 0 1px 0 #fff,0 8px 0 #d2ccbf,0 28px 34px -16px rgba(40,28,10,.45)', ff: 'Archivo,sans-serif', ink: '#1e1d1a', tsh: 'none', title: 'git log --graph', hp: '16px 18px 0', hbg: 'transparent', hfg: '#6b665b', hs: '12px', hb: '0', hx: 'none',
    b1: BTN + "padding:9px 14px;border:0;border-radius:11px;background:#2c55e0;color:#fff;font:800 13px Archivo,sans-serif;box-shadow:0 5px 0 #1a36a3,0 10px 12px -6px rgba(40,28,10,.35)", b2: BTN + "padding:9px 14px;border:0;border-radius:11px;background:#f4b52a;color:#1e1d1a;font:800 13px Archivo,sans-serif;box-shadow:0 5px 0 #b9821a,0 10px 12px -6px rgba(40,28,10,.35)", b3: BTN + "padding:9px 14px;border:0;border-radius:11px;background:#fff;color:#1e1d1a;font:800 13px Archivo,sans-serif;box-shadow:0 5px 0 #cfc8b8,0 10px 12px -6px rgba(40,28,10,.35)", l1: 'Merge', l2: 'Branch from', l3: 'Reset', press: 'press', sh2: '#b9821a',
    cap: 'round', sr: 'auto', rr: 14, sq: 'none', ci: 'block', nr: 8, nsw: 3, mk: '#1e1d1a', mute: '#6b665b', hash: '#ef4f2b', acc: '#1e1d1a', pb: '0', ps: '14px', lf: 'Archivo,sans-serif', lfs: '1.9cqw', lfw: 800, tr: '0deg', tagbg: '#ef4f2b', tagfg: '#fff', tagr: '6px', ring: '#1e1d1a', scan: 'none',
    lc: { 'main': '#2c55e0', 'feature/login': '#ef4f2b', 'fix/parser': '#f4b52a', 'hotfix/api': '#33b07a' }, hot: '#1e1d1a', nfill: null, curve: false, ew: 8 },
};
class Component extends DCLogic {
  state = { hov: null, sel: 'h2', branch: null, merged: false, hotfix: null, status: 'ready' };
  gitList() {
    const L = COMMITS.slice(); if (this.state.merged) L.push(MERGE);
    const hf = this.state.hotfix;
    if (hf) { const p = COMMITS.find(c => c.id === hf); L.push({ id: 'n1', b: 'hotfix/api', x: p.x + 1, hash: '4be7a20', msg: 'fix: null check in api', au: 'you', t: 'just now', p: [hf] }, { id: 'n2', b: 'hotfix/api', x: p.x + 2, hash: 'd90c1e6', msg: 'test: add regression test', au: 'you', t: 'just now', p: ['n1'] }); }
    return L;
  }
  renderVals() {
    const S = this.state, v = this.props.variant ?? 'retro', u = U[v] || U.retro;
    const list = this.gitList(), byId = Object.fromEntries(list.map(c => [c.id, c]));
    const focus = S.hov || S.sel, cur = byId[focus] || byId.h2, near = new Set([focus]);
    if (byId[focus]) byId[focus].p.forEach(q => near.add(q)); list.forEach(c => { if (c.p.includes(focus)) near.add(c.id); });
    const em = S.branch, dim = b => em && b !== em ? .28 : 1, xy = c => [px(c.x), LY[c.b]];
    const edges = [];
    list.forEach(c => c.p.forEach((pid, k) => {
      const p = byId[pid]; if (!p) return; const [x1, y1] = xy(p), [x2, y2] = xy(c), hot = near.has(c.id) && near.has(pid);
      const fresh = (c.id === 'm9' && k === 1) || (c.id === 'n1');
      let d; if (y1 === y2) d = `M${x1} ${y1}H${x2}`; else if (u.curve) d = c.merge ? `M${x1} ${y1}C${x1 + ST / 2} ${y1} ${x2 - ST / 2} ${y2} ${x2} ${y2}` : `M${x1} ${y1}C${x1 + ST / 2} ${y1} ${x2 - ST / 2} ${y2} ${x2} ${y2}`; else if (c.merge) d = `M${x1} ${y1}H${x2 - ST / 2}V${y2}H${x2}`; else d = `M${x1} ${y1}H${x1 + ST / 2}V${y2}H${x2}`;
      edges.push({ d, c: hot ? u.hot : u.lc[c.b], w: hot ? u.ew + 2 : u.ew, op: dim(c.b), anim: fresh && !RM ? 'draw .9s steps(10,end) both' : 'none' });
    }));
    const nodes = list.map(c => { const [x, y] = xy(c), hot = near.has(c.id), isNew = ['m9', 'n1', 'n2'].includes(c.id); return { x, y, op: dim(c.b), fill: c.merge ? '#ffd34d' : hot && v === 'retro' ? '#c9ffd2' : (u.nfill || u.lc[c.b]), stroke: v === 'retro' ? (hot ? '#ffffff' : '#061108') : hot ? u.hot : u.lc[c.b], ring: S.sel === c.id ? 'block' : 'none', merge: c.merge ? 'block' : 'none', headShow: c.id === (S.merged ? 'm9' : 'f6') ? 'block' : 'none', anim: RM ? 'none' : isNew ? 'px-on 10ms steps(1,end) .7s both' : `px-on ${v === 'retro' ? '10ms steps(1,end)' : '.3s ease'} ${c.x * 90}ms both`, enter: () => this.setState({ hov: c.id }), leave: () => this.setState({ hov: null }), pick: () => this.setState({ sel: c.id, status: 'checkout ' + c.hash }) }; });
    const bn = [...new Set(list.map(c => c.b))];
    const lanes = bn.map(n => ({ name: n, left: (6 / 800 * 100) + '%', top: ((LY[n] - 13) / 330 * 100).toFixed(2) + '%', bg: em === n ? (v === 'retro' ? '#0f2a14' : 'rgba(0,0,0,.06)') : 'transparent', fg: v === 'retro' || v === 'minimal' || v === 'craft' || v === 'toy' ? u.lc[n] : u.ink, op: dim(n), pick: () => this.setState(s => ({ branch: s.branch === n ? null : n, status: s.branch === n ? 'ready' : 'focus ' + n })) }));
    const tags = list.filter(c => c.tag).map(c => ({ t: c.tag, left: (px(c.x) / 800 * 100).toFixed(2) + '%', top: ((LY[c.b] - 36) / 330 * 100).toFixed(2) + '%' }));
    const git = {
      lanes, tags, edges, nodes, cur: { hash: cur.hash, msg: cur.msg, meta: `${cur.b} · ${cur.au} · ${cur.t}${cur.tag ? ' · tag ' + cur.tag : ''}${cur.merge ? ' · MERGE' : ''}` },
      status: S.status, blink: RM ? 'none' : 'blink 1s steps(1,end) infinite', head: S.merged ? 'main (merged)' : 'main', count: list.length, branches: bn.length, selHash: byId[S.sel] ? byId[S.sel].hash.slice(0, 7) : 'HEAD',
      doMerge: () => this.setState(s => s.merged ? s : { merged: true, status: 'merging feature/login... done', sel: 'm9' }),
      doBranch: () => this.setState(s => s.hotfix ? s : { hotfix: byId[s.sel] && byId[s.sel].b !== 'hotfix/api' ? s.sel : 'f6', status: 'checkout -b hotfix/api', sel: 'n2' }),
      doReset: () => this.setState({ merged: false, hotfix: null, branch: null, sel: 'h2', hov: null, status: 'ready' }),
    };
    return { u: { ...u, b1: css(u.b1), b2: css(u.b2), b3: css(u.b3) }, git };
  }
}
</script>
</body>
</html>

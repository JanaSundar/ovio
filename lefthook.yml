# Git hooks, installed by `pnpm install` (lefthook's postinstall; skipped in CI).
# Skip them for one command with LEFTHOOK=0, e.g. `LEFTHOOK=0 git commit -m "wip"`.
# CI runs the same checks and more (build, Playwright), so the hooks only catch things early.

# Staged files only, so a commit stays quick: format them in place and lint them.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,mjs,cjs,ts,tsx,json,css,md,yml,yaml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec oxlint {staged_files}

# The whole project, before it leaves the machine.
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: unit tests
      run: pnpm test
    - name: registry
      run: pnpm registry:check

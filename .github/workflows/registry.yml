name: Registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate registry.json at this commit
        run: npx shadcn@latest registry validate "${{ github.repository }}#${{ github.event.pull_request.head.sha || github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
